[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.8.1"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# turbo-dom 0.8.1 is on crates.io — the member crates depend on `"0.8.1"`
# (parser alias on `"0.8"`) / `"150.4"` directly, no patch bridge needed.
#
# v0.8.2 RC validation: pin the four turbo-dom crates to the public
# release/0.8.2 branch so the 0.8.2 fix set (incl. turbo-dom#478 iframe
# inline-handler parent-realm) is exercised before turbo-dom 0.8.2 is cut
# on crates.io. Remove this block once turbo-dom 0.8.2 is published.
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", branch = "release/0.8.2" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", branch = "release/0.8.2" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", branch = "release/0.8.2" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom", branch = "release/0.8.2" }
