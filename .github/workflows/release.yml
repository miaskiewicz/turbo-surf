# Release — on a `v*` tag, build the standalone `turbo-surf-mcp` binary for every
# platform and publish `turbo-surf` (the thin launcher npm package,
# which spawns the binary). No napi, no Node hosting Rust — same model as
# turbo-test. The Rust crates publish separately (rust-crates-publish.yml).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release versions and exact tag
        shell: bash
        run: |
          python3 scripts/check-versions.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              expected = 'v' + version
              if os.environ['GITHUB_REF'] != 'refs/tags/' + expected:
                  raise SystemExit('Release tag must exactly match ' + expected)
          print('Release source:', os.environ['GITHUB_SHA'], 'version:', version)
          PYCODE

  build:
    needs: validate
    name: build ${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-14, target: aarch64-apple-darwin, node: darwin-arm64 }
          # darwin-x64 (Intel Mac) dropped: GitHub's macos-13 runners are scarce/slow
          # and stall releases. Matches the sibling repos (turbo-dom/turbo-html2pdf).
          # Apple-Silicon (darwin-arm64) covers modern Macs; Intel falls back to a clear
          # "no prebuilt binary" error (build from source).
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu, node: linux-x64 }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node: linux-arm64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, node: win32-x64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { targets: "${{ matrix.target }}" }
      # BoringSSL (the default `impersonate` anti-bot backend) builds with cmake + nasm.
      - name: Install BoringSSL toolchain (nasm/cmake)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y nasm cmake ;;
            macOS)   brew install nasm cmake || true ;;
            Windows) choco install nasm --no-progress -y && echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH" ;;
          esac
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build the MCP binary
        # Pinned upstream Chrome 154 transport already includes real trust anchors.
        run: cargo build --locked --release -p turbo-surf-mcp --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Verify third-party notices
        run: python3 scripts/sync-third-party-notices.py --check
      - name: Stage platform binary
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/${{ matrix.target }}/release/turbo-surf-mcp${{ matrix.ext }}" \
             "out/turbo-surf-mcp-${{ matrix.node }}${{ matrix.ext }}"
          cp LICENSE THIRD_PARTY_NOTICES.md out/
      - name: Smoke the actual staged binary over stdio
        shell: bash
        env:
          STAGED_BINARY: turbo-surf-mcp-${{ matrix.node }}${{ matrix.ext }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, signal, subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          binary = root / 'out' / os.environ['STAGED_BINARY']
          version = json.loads((root / 'package.json').read_text())['version']
          work = Path(os.environ['RUNNER_TEMP']) / 'staged-mcp-smoke'
          work.mkdir()
          if any((parent / '.env').exists() for parent in [work, *work.parents]):
              raise SystemExit('The isolated MCP smoke cwd must have no ancestor .env')
          env = {key: value for key, value in os.environ.items() if key not in ('HYPER_API_KEY', 'SCRAPFLY_API_KEY', 'TURBO_SURF_SOLVER', 'TURBO_SURF_BROWSER_CMD')}
          request = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2024-11-05', 'capabilities': {}, 'clientInfo': {'name': 'release-smoke', 'version': '1'}}}
          child = subprocess.Popen([str(binary)], cwd=work, env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, start_new_session=os.name != 'nt')
          timed_out = False
          try:
              stdout, stderr = child.communicate(json.dumps(request) + '\n', timeout=60)
          except subprocess.TimeoutExpired:
              timed_out = True
              if os.name == 'nt':
                  child.kill()
              else:
                  os.killpg(child.pid, signal.SIGKILL)
              stdout, stderr = child.communicate()
          proof = root / 'smoke-proof'
          proof.mkdir()
          (proof / 'stdout.log').write_text(stdout)
          (proof / 'stderr.log').write_text(stderr)
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'binary': str(binary), 'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'cwd': str(work), 'timeoutSeconds': 60, 'timedOut': timed_out, 'exitCode': child.returncode, 'expectedVersion': version}
          (proof / 'initialize.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if timed_out or child.returncode != 0:
              raise SystemExit('Staged MCP initialization failed; see smoke-proof')
          rows = [json.loads(line) for line in stdout.splitlines() if line.strip()]
          if len(rows) != 1 or rows[0].get('jsonrpc') != '2.0' or rows[0].get('id') != 1 or 'error' in rows[0] or rows[0].get('result', {}).get('serverInfo') != {'name': 'turbo-surf', 'version': version}:
              raise SystemExit('Staged MCP initialize response does not match the release')
          receipt['initializeVerified'] = True
          (proof / 'initialize.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-smoke-${{ matrix.node }}
          path: smoke-proof/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.node }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Collect prebuilt binaries into bin/
        run: |
          mkdir -p bin
          find artifacts -type f -name 'turbo-surf-mcp-*' -exec cp {} bin/ \;
          chmod +x bin/* || true
          ls -la bin/
      - name: Pack, inspect and smoke the exact npm release tarball
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, shutil, signal, subprocess, tarfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          metadata = json.loads((root / 'package.json').read_text())
          version = metadata['version']
          output = Path(os.environ['RUNNER_TEMP']) / 'npm-release-package'
          output.mkdir()
          packed = subprocess.run(['npm', 'pack', '--json', '--ignore-scripts', '--pack-destination', str(output)], cwd=root, capture_output=True, text=True)
          (output / 'npm-pack.json').write_text(packed.stdout)
          (output / 'npm-pack.stderr.log').write_text(packed.stderr)
          packed.check_returncode()
          packages = json.loads(packed.stdout)
          if len(packages) != 1 or packages[0]['name'] != 'turbo-surf' or packages[0]['version'] != version:
              raise SystemExit('npm pack did not produce the exact release package')
          archive = output / packages[0]['filename']
          archive_bytes = archive.read_bytes()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(archive_bytes).digest()).decode()
          if integrity != packages[0]['integrity'] or hashlib.sha1(archive_bytes).hexdigest() != packages[0]['shasum']:
              raise SystemExit('npm pack integrity does not match the actual tarball')
          bins = {'turbo-surf-mcp-darwin-arm64', 'turbo-surf-mcp-linux-x64', 'turbo-surf-mcp-linux-arm64', 'turbo-surf-mcp-win32-x64.exe'}
          required = {'package.json', 'cli.js', 'index.js', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md', 'CHANGELOG.md'} | {'bin/' + name for name in bins}
          work = Path(os.environ['RUNNER_TEMP']) / 'npm-installed-smoke'
          work.mkdir()
          if any((parent / '.env').exists() for parent in [work, *work.parents]):
              raise SystemExit('The isolated npm smoke cwd must have no ancestor .env')
          hashes = {}
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate tarball paths')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'package' or not (member.isfile() or member.isdir()):
                      raise SystemExit('Unsafe npm tarball entry: ' + member.name)
              files = {member.name.removeprefix('package/') for member in members if member.isfile()}
              if not required <= files or {name.removeprefix('bin/') for name in files if name.startswith('bin/')} != bins:
                  raise SystemExit('npm tarball is missing a release file or has unexpected platform binaries')
              for name in sorted(required):
                  data = tar.extractfile('package/' + name).read()
                  if not data or data != (root / name).read_bytes():
                      raise SystemExit('Packed release file differs from the staged source: ' + name)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              tar.extractall(work, filter='data')
          installed = work / 'package'
          actual = json.loads((installed / 'package.json').read_text())
          if actual['name'] != metadata['name'] or actual['version'] != version:
              raise SystemExit('Extracted npm package identity mismatch')
          for name in bins - {'turbo-surf-mcp-win32-x64.exe'}:
              if not (installed / 'bin' / name).stat().st_mode & 0o111:
                  raise SystemExit('Packed native binary lost executable permissions: ' + name)
          env = {key: value for key, value in os.environ.items() if key not in ('HYPER_API_KEY', 'SCRAPFLY_API_KEY', 'TURBO_SURF_SOLVER', 'TURBO_SURF_BROWSER_CMD')}
          request = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2024-11-05', 'capabilities': {}, 'clientInfo': {'name': 'npm-release-smoke', 'version': '1'}}}
          child = subprocess.Popen([shutil.which('node'), str(installed / 'cli.js')], cwd=work, env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, start_new_session=True)
          timed_out = False
          try:
              stdout, stderr = child.communicate(json.dumps(request) + '\n', timeout=60)
          except subprocess.TimeoutExpired:
              timed_out = True
              # The packaged Node launcher owns a native child in this same group.
              os.killpg(child.pid, signal.SIGKILL)
              stdout, stderr = child.communicate()
          (output / 'initialize.stdout.log').write_text(stdout)
          (output / 'initialize.stderr.log').write_text(stderr)
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'archive': str(archive), 'sha256': hashlib.sha256(archive_bytes).hexdigest(), 'integrity': integrity, 'version': version, 'fileSha256': hashes, 'cli': str(installed / 'cli.js'), 'cwd': str(work), 'timeoutSeconds': 60, 'timedOut': timed_out, 'exitCode': child.returncode}
          (output / 'initialize.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if timed_out or child.returncode != 0:
              raise SystemExit('Packaged npm CLI initialization failed; see retained package evidence')
          rows = [json.loads(line) for line in stdout.splitlines() if line.strip()]
          if len(rows) != 1 or rows[0].get('jsonrpc') != '2.0' or rows[0].get('id') != 1 or 'error' in rows[0] or rows[0].get('result', {}).get('serverInfo') != {'name': 'turbo-surf', 'version': version}:
              raise SystemExit('Packaged npm CLI initialize response does not match the release')
          receipt['initializeVerified'] = True
          (output / 'initialize.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as github_env:
              github_env.write('RELEASE_TARBALL=' + str(archive) + '\n')
          print(json.dumps(receipt, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/npm-release-package/*
          if-no-files-found: warn
      - run: npm publish "$RELEASE_TARBALL" --provenance --access public
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
