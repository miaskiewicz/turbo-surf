[package]
name = "turbo-surf-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf MCP server — native Rust binary, stdio JSON-RPC (no Node)"

[lib]
name = "turbo_surf_mcp"
path = "src/lib.rs"

[[bin]]
name = "turbo-surf-mcp"
path = "src/main.rs"

[features]
# The pinned Chrome 154 transport includes real Chromium trust-anchor IDs.
# The reviewed named registry dependencies preserve this API; see PUBLISHING.md.
default = ["impersonate", "avif", "jxl"]
# Build the MCP binary with a real Chrome TLS/JA3/JA4 + HTTP-2 fingerprint
# (BoringSSL, via turbo-surf-core's `impersonate`). Needs a C toolchain (cmake/nasm) at
# build time. ON by default (anti-bot). See turbo-surf-core/src/net.rs.
impersonate = ["turbo-surf-core/impersonate"]
# Compatibility alias for the Chrome 154 impersonation profile, which already
# emits real trust-anchor IDs from its Chromium root store.
trust-anchors = ["turbo-surf-core/trust-anchors"]
# AVIF screenshot pixels (turbo-surf#30): turbo-dom-raster's pure-Rust rav1d decoder
# (BSD-2-Clause, no assembly, no C toolchain). ON by default: live loads already size
# AVIF and image requests advertise `image/avif` as Chrome does, so CDNs serve it.
# Without it an AVIF lays out at its real size and paints as the placeholder.
avif = ["turbo-dom-raster/avif"]
# JPEG XL screenshot pixels (turbo-surf#43): turbo-dom-raster's pure-Rust jxl-oxide decoder
# (MIT OR Apache-2.0, single-threaded). ON by default: Chrome 156 decodes JPEG XL, live
# loads size it and image requests advertise `image/jxl` as Chrome does, so CDNs serve it.
# Without it a JPEG XL lays out at its real size and paints as the placeholder.
jxl = ["turbo-dom-raster/jxl"]
# Real Apple-GPU (wgpu→Metal) canvas rasterization for the render tier's toDataURL — genuine
# GPU pixels instead of tiny-skia's software raster. OFF by default (macOS-only, pulls wgpu +
# a C/Metal toolchain); enable where a real GPU is present. See turbo-dom-raster's `gpu-metal`.
gpu-metal = ["turbo-dom-raster/gpu-metal"]
# CoreText/CoreGraphics canvas-TEXT rasterization for getImageData (macOS only) — glyph pixels that
# match a real Mac Chrome instead of the tiny-skia glyph trace. OFF by default; macOS system
# frameworks only. See turbo-dom-raster's `coretext`.
coretext = ["turbo-dom-raster/coretext"]
# Forward turbo-surf-render's native-sdk-frame-read (the engine-154/155 native-SDK
# overlay enables it; see turbo-dom-browser-env's README).
native-sdk-frame-read = ["turbo-surf-render/native-sdk-frame-read"]

[dependencies]
turbo-surf-core = { path = "../turbo-surf-core", version = "0.6.0" }
turbo-surf-view = { path = "../turbo-surf-view", version = "0.6.0" }
turbo-surf-page = { path = "../turbo-surf-page", version = "0.6.0" }
turbo-dom-raster = "0.6.0"
turbo-surf-render = { path = "../turbo-surf-render", version = "0.6.0" }
turbo-dom-parser = { package = "turbo-dom", version = "0.6" }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "net", "time"] }
# SERP `search` tool: URL-encode the query + decode engine redirect wrappers
# (DuckDuckGo `uddg`, Google `/url?q=`) via the same `url` crate core already uses.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
# tests/screenshot_image_formats.rs: decode the screenshot PNG and pin its Chrome control.
turbo-dom-layout = "0.6.0"
sha2 = "0.10"
