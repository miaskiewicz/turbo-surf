[package]
name = "turbo-surf-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf MCP server — native Rust binary, stdio JSON-RPC (no Node)"

[lib]
name = "turbo_surf_mcp"
path = "src/lib.rs"

[[bin]]
name = "turbo-surf-mcp"
path = "src/main.rs"

[features]
# NB: `trust-anchors` is deliberately NOT in `default`. It relies on a field
# (`TlsOptions::trust_anchors`) that exists ONLY in turbo-surf's VENDORED `wreq`
# (rust/vendor/wreq), not in the crates.io `wreq` release. `cargo publish` verifies the
# `turbo-surf-mcp` crate against the REGISTRY `wreq` (path/patch overrides don't apply to a
# published crate's deps), so a default that enables trust-anchors fails `cargo publish` with
# `no field 'trust_anchors' on type '&mut TlsOptions'` (this bit us on v0.5.1). The SHIPPED
# npm binary still gets trust-anchors: release.yml builds it with `--features trust-anchors`
# against the vendored wreq. Local builds/tests use the vendored wreq too, so the feature is
# testable there. Keep any vendored-wreq-only feature OUT of every crate `default`.
default = ["impersonate"]
# Build the MCP binary with a real Chrome TLS/JA3/JA4 + HTTP-2 fingerprint
# (BoringSSL, via turbo-surf-core's `impersonate`). Needs a C toolchain (cmake/nasm) at
# build time. ON by default (anti-bot). See turbo-surf-core/src/net.rs.
impersonate = ["turbo-surf-core/impersonate"]
# Emit Chrome 152+'s `trust_anchors` TLS extension (codepoint 0xCA34 / 51764) so JA4
# matches real Chrome's `t13d1517h2`. OFF by default (vendored-wreq-only — see the note on
# `default` above); the release binary enables it. Implies `impersonate`.
# See turbo-surf-core's `trust-anchors` feature and net.rs `emulate()`.
trust-anchors = ["turbo-surf-core/trust-anchors"]
# Real Apple-GPU (wgpu→Metal) canvas rasterization for the render tier's toDataURL — genuine
# GPU pixels instead of tiny-skia's software raster. OFF by default (macOS-only, pulls wgpu +
# a C/Metal toolchain); enable where a real GPU is present. See turbo-surf-raster's `gpu-metal`.
gpu-metal = ["turbo-surf-raster/gpu-metal"]
# CoreText/CoreGraphics canvas-TEXT rasterization for getImageData (macOS only) — glyph pixels that
# match a real Mac Chrome instead of the tiny-skia glyph trace. OFF by default; macOS system
# frameworks only. See turbo-surf-raster's `coretext`.
coretext = ["turbo-surf-raster/coretext"]

[dependencies]
turbo-surf-core = { path = "../turbo-surf-core", version = "0.5.2" }
turbo-surf-view = { path = "../turbo-surf-view", version = "0.5.2" }
turbo-surf-page = { path = "../turbo-surf-page", version = "0.5.2" }
turbo-surf-raster = { path = "../turbo-surf-raster", version = "0.5.2" }
turbo-surf-render = { path = "../turbo-surf-render", version = "0.5.2" }
turbo-dom-parser = { package = "turbo-dom", version = "0.5.1" }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "net", "time"] }
# SERP `search` tool: URL-encode the query + decode engine redirect wrappers
# (DuckDuckGo `uddg`, Google `/url?q=`) via the same `url` crate core already uses.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
