# Line-coverage gate for the turbo-surf Rust workspace (all eight member crates' `src/`).
# Run from rust/: `cargo tarpaulin` (reads this file). CI: the `coverage` job in
# .github/workflows/ci.yml (macOS arm64, where the floor was measured).
#
# fail-under is the workspace total MEASURED on refactor/turbo-dom-consolidation 27ed802 +
# the first coverage-phase tests (2026-10-27, tarpaulin 0.37.5, LLVM engine, macOS arm64,
# simdutf rusty_v8 150.4.0): 84.14%, 18632/22145 lines, rounded down to 84.1. Per-crate
# floors from the same run are in coverage-floors.json (CI: scripts/check-coverage-floors.py).
# The coverage phase raises both toward >= 99.5 with behaviour-asserting tests; never lower
# them to pass a change.
[surf]
engine = "Llvm"
workspace = true
include-files = ["crates/*/src/*"]
target-dir = "target/cov"
timeout = "600s"
# Run every test binary even after a failure, so a red run still reports full coverage.
no-fail-fast = true
out = ["Stdout", "Json"]
output-dir = "target/cov/report"
fail-under = 84.1
