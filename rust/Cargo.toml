[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-raster",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.5.4"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Chrome 154 requires APIs newer than the published 0.16.1/0.2.0 crates.
# Pin the coherent upstream stack, including BoringSSL via btls-sys's submodule.
# Workspace patches do not propagate to crates.io consumers: library publishing
# remains blocked until these APIs are published or a distributable fork is reviewed.
[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "c6fd8b1acfa96bc0175e2825c88ccda28e23d9b5" }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "5715529002738f46eea86a7271f918f9374d3582" }
btls = { git = "https://github.com/0x676e67/btls", rev = "f5a8a483eca2e0b3f539f944604da3f8e14a910e" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "f5a8a483eca2e0b3f539f944604da3f8e14a910e" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "f5a8a483eca2e0b3f539f944604da3f8e14a910e" }
