[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.7.0"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Pre-publish only: turbo-dom, turbo-dom-layout, turbo-dom-raster and turbo-dom-browser-env
# 0.7.0 come from turbo-dom's 0.7.0 release branch (miaskiewicz/turbo-dom#232,
# ci/ubuntu-2204-glibc-guard) until they are on crates.io; turbo-dom-v8 150.4.0 stays on
# crates.io. Remove this block and re-lock
# (`cargo update -p turbo-dom -p turbo-dom-layout -p turbo-dom-raster -p turbo-dom-browser-env`)
# before tagging (see PUBLISHING.md); the tag-only release guard fails while it is present.
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a539d7cfc6dbe50abfacc852ee2e555f93c9d334" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a539d7cfc6dbe50abfacc852ee2e555f93c9d334" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a539d7cfc6dbe50abfacc852ee2e555f93c9d334" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "a539d7cfc6dbe50abfacc852ee2e555f93c9d334" }
