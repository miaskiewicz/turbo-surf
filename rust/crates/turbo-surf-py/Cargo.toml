[package]
name = "turbo-surf-py"
description = "PyO3 binding: the turbo-surf browserless crawl/extract engine exposed to Python (PyPI: turbo-surf)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib for the Python extension module (maturin packages it); rlib so the
# binding still type-checks and links on the host for clippy/fmt without the
# Python interpreter. Mirrors the proven turbo-surf-napi crate layout.
[lib]
name = "turbo_surf_py"
crate-type = ["cdylib", "rlib"]

[features]
# Real Apple-GPU (wgpu→Metal) canvas rasterization — OFF by default so the published wheels
# never pull wgpu / a C-Metal toolchain. See turbo-dom-raster's `gpu-metal`.
gpu-metal = ["turbo-dom-raster/gpu-metal"]
# CoreText/CoreGraphics canvas-text raster (macOS only). See turbo-dom-raster's `coretext`.
coretext = ["turbo-dom-raster/coretext"]
# Forward turbo-surf-render's native-sdk-frame-read (the engine-154/155 native-SDK
# overlay enables it; see turbo-dom-browser-env's README).
native-sdk-frame-read = ["turbo-surf-render/native-sdk-frame-read"]
# TEMPORARY consolidation gate (turbo-dom docs/selector-dual-gate.md): forward turbo-dom's
# `selector-dual` (frozen B-main selector engine run next to the current one). Never
# enable it in a published or production build; removed in the last S3b commit.
selector-dual = ["turbo-dom-parser/selector-dual", "turbo-surf-render/selector-dual", "turbo-surf-view/selector-dual"]

[dependencies]
turbo-surf-view = { path = "../turbo-surf-view", version = "0.5.5" }
turbo-dom-raster = "0.6.0"
turbo-surf-render = { path = "../turbo-surf-render", version = "0.5.5" }
turbo-surf-transform = { path = "../turbo-surf-transform", version = "0.5.5" }
turbo-dom-parser = { package = "turbo-dom", version = "0.5.8" }
serde = "1"
serde_json = "1"
# A current-thread tokio runtime drives the async render tier from a sync Python
# call (matches how turbo-surf-napi's `render` blocks on a per-call runtime).
tokio = { version = "1", features = ["rt"] }
# PyO3 0.23: `abi3-py38` yields a single stable-ABI wheel that loads on
# CPython 3.8+. `extension-module` (drops the libpython link for a portable
# wheel) is NOT a default feature: it would break `cargo test/clippy
# --workspace` (the test binary needs libpython symbols extension-module hides).
# maturin adds it at wheel-build time via the pyproject `[tool.maturin] features`.
pyo3 = { version = "0.23", default-features = false, features = [
    "abi3-py38",
    "macros",
] }
