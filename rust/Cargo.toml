[workspace]
resolver = "2"
exclude = ["vendor/deno_crypto", "vendor/rusty_v8"]
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-raster",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.5.4"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Development patch: consume the unreleased turbo-html2pdf-core
# ComputedStyle::iter and turbo-dom iframe srcdoc parsing from the #28 upstream
# integration branches (miaskiewicz/turbo-html2pdf#27, miaskiewicz/turbo-dom#17)
# until they are published.
[patch.crates-io]
turbo-html2pdf-core = { git = "https://github.com/miaskiewicz/turbo-html2pdf", branch = "parity/issue-28-batch" }
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", branch = "parity/issue-28-batch" }
