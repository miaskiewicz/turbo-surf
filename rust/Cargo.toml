[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-raster",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.4.2"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Vendored fork of wreq (6.0.0-rc.29): adds a `trust_anchors` field to `TlsOptions`
# + a builder method, and applies it via BoringSSL's
# `SSL_CTX_set1_requested_trust_anchors` in `tls/conn.rs`, so we can emit Chrome
# 152+'s `trust_anchors` ClientHello extension (codepoint 0xCA34). Gated in
# turbo-surf-core behind the (off-by-default) `trust-anchors` feature; the field is
# inert (`None`) otherwise, so the default build behaves exactly as stock wreq. The
# diff lives under vendor/wreq — see the "turbo-surf patch" comments in tls.rs and
# tls/conn.rs.
[patch.crates-io]
wreq = { path = "vendor/wreq" }
