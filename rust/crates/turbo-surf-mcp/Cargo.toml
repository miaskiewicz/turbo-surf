[package]
name = "turbo-surf-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf MCP server — native Rust binary, stdio JSON-RPC (no Node)"

[lib]
name = "turbo_surf_mcp"
path = "src/lib.rs"

[[bin]]
name = "turbo-surf-mcp"
path = "src/main.rs"

[features]
default = ["impersonate"]
# Build the MCP binary with a real Chrome TLS/JA3/JA4 + HTTP-2 fingerprint
# (BoringSSL, via turbo-surf-core's `impersonate`). Off by default — it needs a C
# toolchain (cmake/nasm) at build time. ON by default (anti-bot). See turbo-surf-core/src/net.rs.
impersonate = ["turbo-surf-core/impersonate"]

[dependencies]
turbo-surf-core = { path = "../turbo-surf-core", version = "0.4.1" }
turbo-surf-view = { path = "../turbo-surf-view", version = "0.4.1" }
turbo-surf-page = { path = "../turbo-surf-page", version = "0.4.1" }
turbo-surf-raster = { path = "../turbo-surf-raster", version = "0.4.1" }
turbo-surf-render = { path = "../turbo-surf-render", version = "0.4.1" }
turbo-dom-parser = { package = "turbo-dom", version = "0.4.0" }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "net", "time"] }
# SERP `search` tool: URL-encode the query + decode engine redirect wrappers
# (DuckDuckGo `uddg`, Google `/url?q=`) via the same `url` crate core already uses.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
