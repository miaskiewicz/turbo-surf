[package]
name = "turbo-surf-core"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browserless native-speed crawler core (Rust port, tier 1)"

[features]
default = ["impersonate"]
# BoringSSL-backed Chrome 154 transport. Requires the pinned upstream stack and
# Rust 1.98 (workspace Cargo.toml); disable with --no-default-features for rustls.
impersonate = ["dep:wreq", "dep:wreq-util", "dep:wreq-proto", "dep:tower"]
# Compatibility alias: the Chrome 154 profile always sends real trust-anchor IDs,
# sourced from the same Chromium root store used to verify server certificates.
trust-anchors = ["impersonate"]

[dependencies]
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
# BoringSSL-backed client for the `impersonate` feature (see [features]).
# `stream` for incremental body reads (byte-cap enforcement); the codec features
# because wreq's Chrome emulation advertises `accept-encoding: gzip, deflate, br,
# zstd` — without them it can't decode the responses it asks for.
#
# These published version numbers identify the current upstream release line;
# workspace Git patches supply the newer Chrome 154 APIs. See publishing limits.
wreq = { version = "0.16.1", default-features = false, optional = true, features = [
    "tokio-rt",
    "chromium-roots",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
wreq-util = { version = "0.2.0", optional = true, features = ["emulation-chromium-pki"] }
wreq-proto = { version = "=0.2.5", optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
encoding_rs = "0.8"
bytes = "1"
http = "1"
httpdate = "1"
tokio = { version = "1", features = [
    "macros",
    "rt",
    "time",
    "sync",
    "process",
    "io-util",
] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
psl = "2"
base64 = "0.22"
sha2 = "0.10"
sfv = "=0.15.0"
urlpattern = "=0.4.2"
regex = "1"
brotli-decompressor = "=6.0.1"
zstd = "0.13"

# Modern Reporting API requests have no Accept default; reqwest inserts one.
hyper-util = { version="0.1", features=["client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
hyper-rustls = { version="0.27", default-features=false, features=["http1", "ring", "tls12"] }
rustls = { version="0.23", default-features=false, features=["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "test-util",
    "net",
    "io-util",
] }

[dependencies.tower]
version = "0.5"
optional = true
