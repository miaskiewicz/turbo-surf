# Release — on a `v*` tag, build the standalone `turbo-surf-mcp` binary AND the
# `turbo-surf-napi` addon (`.node`) for every platform, publish per-platform
# `@miaskiewicz/turbo-surf-<platform>` npm packages (each carrying one binary +
# one .node addon), then publish the thin `turbo-surf` launcher (cli.js/index.js)
# that resolves them as optionalDependencies. The Rust crates publish separately
# (rust-crates-publish.yml).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the offline release smoke supervisor
        run: python3 -B scripts/test_smoke_mcp_release.py
      - name: Check release versions and exact tag
        shell: bash
        run: |
          python3 scripts/check-versions.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              expected = 'v' + version
              if os.environ['GITHUB_REF'] != 'refs/tags/' + expected:
                  raise SystemExit('Release tag must exactly match ' + expected)
          print('Release source:', os.environ['GITHUB_SHA'], 'version:', version)
          PYCODE
      - name: Release guard (no [patch] table, no git sources, prerequisites on crates.io)
        if: github.event_name == 'push'
        working-directory: rust
        run: python3 -B release-deps/release_guard.py

  build:
    needs: validate
    name: build ${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin, node: darwin-arm64, napi: darwin-arm64, cdylib: libturbo_surf_napi.dylib, npm_dir: darwin-arm64 }
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu, node: linux-x64, napi: linux-x64-gnu, cdylib: libturbo_surf_napi.so, npm_dir: linux-x64 }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node: linux-arm64, napi: linux-arm64-gnu, cdylib: libturbo_surf_napi.so, npm_dir: linux-arm64 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, node: win32-x64, ext: .exe, napi: win32-x64-msvc, cdylib: turbo_surf_napi.dll, npm_dir: win32-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { targets: "${{ matrix.target }}" }
      - name: Install BoringSSL and binding toolchain
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y clang libclang-dev nasm cmake ;;
            macOS)   brew install nasm cmake || true ;;
            Windows) choco install nasm --no-progress -y && echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH" ;;
          esac
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build the MCP binary and napi addon
        shell: bash
        run: |
          cargo build --locked --release -p turbo-surf-mcp -p turbo-surf-napi \
            --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Verify third-party notices
        run: python3 scripts/sync-third-party-notices.py --check
      - name: Stage platform binary and napi addon
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/${{ matrix.target }}/release/turbo-surf-mcp${{ matrix.ext }}" \
             "out/turbo-surf-mcp-${{ matrix.node }}${{ matrix.ext }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" \
             "out/turbo-surf.${{ matrix.napi }}.node"
          cp LICENSE THIRD_PARTY_NOTICES.md out/
      - name: Smoke the actual staged binary over stdio
        shell: bash
        env:
          STAGED_BINARY: turbo-surf-mcp-${{ matrix.node }}${{ matrix.ext }}
        run: |
          version=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          python scripts/smoke-mcp-release.py \
            --binary "$PWD/out/$STAGED_BINARY" --expected-version "$version" \
            --source-commit "$GITHUB_SHA" --work "$RUNNER_TEMP/staged-mcp-smoke" \
            --output "$PWD/smoke-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-smoke-${{ matrix.node }}
          path: smoke-proof/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.node }}
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish per-platform @miaskiewicz/turbo-surf-<platform> packages.
  # Each carries one MCP binary + one .node addon (<200 MB each, under npm limit).
  # ---------------------------------------------------------------------------
  publish-platform:
    needs: build
    name: publish ${{ matrix.npm_dir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: darwin-arm64, npm_dir: darwin-arm64, ext: '', mcp_name: turbo-surf-mcp, napi_name: 'turbo-surf.darwin-arm64.node' }
          - { node: linux-x64, npm_dir: linux-x64, ext: '', mcp_name: turbo-surf-mcp, napi_name: 'turbo-surf.linux-x64-gnu.node' }
          - { node: linux-arm64, npm_dir: linux-arm64, ext: '', mcp_name: turbo-surf-mcp, napi_name: 'turbo-surf.linux-arm64-gnu.node' }
          - { node: win32-x64, npm_dir: win32-x64, ext: .exe, mcp_name: turbo-surf-mcp.exe, napi_name: 'turbo-surf.win32-x64-msvc.node' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.node }}
          path: artifact
      - name: Stage platform package
        shell: bash
        run: |
          pkg_dir="npm/${{ matrix.npm_dir }}"
          cp "artifact/turbo-surf-mcp-${{ matrix.node }}${{ matrix.ext }}" \
             "$pkg_dir/${{ matrix.mcp_name }}"
          cp "artifact/${{ matrix.napi_name }}" "$pkg_dir/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$pkg_dir/"
          chmod +x "$pkg_dir/${{ matrix.mcp_name }}" || true
          ls -la "$pkg_dir/"
      - name: Publish platform package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: npm/${{ matrix.npm_dir }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish the thin `turbo-surf` launcher (no native binaries — those come
  # from the per-platform optionalDependencies above).
  # ---------------------------------------------------------------------------
  publish:
    needs: publish-platform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Pack and verify the thin launcher tarball
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          metadata = json.loads((root / 'package.json').read_text())
          version = metadata['version']
          output = Path(os.environ['RUNNER_TEMP']) / 'npm-release-package'
          output.mkdir()
          packed = subprocess.run(['npm', 'pack', '--json', '--ignore-scripts', '--pack-destination', str(output)], cwd=root, capture_output=True, text=True)
          (output / 'npm-pack.json').write_text(packed.stdout)
          (output / 'npm-pack.stderr.log').write_text(packed.stderr)
          packed.check_returncode()
          packages = json.loads(packed.stdout)
          if len(packages) != 1 or packages[0]['name'] != 'turbo-surf' or packages[0]['version'] != version:
              raise SystemExit('npm pack did not produce the exact release package')
          archive = output / packages[0]['filename']
          archive_bytes = archive.read_bytes()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(archive_bytes).digest()).decode()
          if integrity != packages[0]['integrity'] or hashlib.sha1(archive_bytes).hexdigest() != packages[0]['shasum']:
              raise SystemExit('npm pack integrity does not match the actual tarball')
          # The thin launcher should NOT contain platform binaries or .node addons.
          napi_meta = {'index.js', 'index.d.ts', 'package.json', 'LICENSE', 'README.md'}
          required = {'package.json', 'cli.js', 'index.js', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md', 'CHANGELOG.md'} \
              | {'rust/crates/turbo-surf-napi/' + name for name in napi_meta}
          hashes = {}
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate tarball paths')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'package' or not (member.isfile() or member.isdir()):
                      raise SystemExit('Unsafe npm tarball entry: ' + member.name)
              files = {member.name.removeprefix('package/') for member in members if member.isfile()}
              # Reject any platform binaries or .node files that snuck in.
              for f in files:
                  if f.startswith('bin/') and 'turbo-surf-mcp' in f:
                      raise SystemExit('Thin launcher tarball must not contain platform binaries: ' + f)
                  if f.endswith('.node') and not f.endswith('.d.ts'):
                      raise SystemExit('Thin launcher tarball must not contain .node addons: ' + f)
              if not required <= files:
                  missing = required - files
                  raise SystemExit('Thin launcher tarball is missing required files: ' + str(missing))
              for name in sorted(required):
                  data = tar.extractfile('package/' + name).read()
                  if not data or data != (root / name).read_bytes():
                      raise SystemExit('Packed release file differs from source: ' + name)
                  hashes[name] = hashlib.sha256(data).hexdigest()
          actual = json.loads((root / 'package.json').read_text())
          if actual['name'] != metadata['name'] or actual['version'] != version:
              raise SystemExit('Package identity mismatch')
          receipt = {'archive': str(archive), 'sha256': hashlib.sha256(archive_bytes).hexdigest(),
              'integrity': integrity, 'version': version, 'fileSha256': hashes, 'thinLauncher': True}
          (output / 'verify.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as github_env:
              github_env.write('RELEASE_TARBALL=' + str(archive) + '\n')
          print(json.dumps(receipt, indent=2))
          PYCODE
      - name: Smoke the launcher with a staged binary
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os, shutil, signal, subprocess
          from pathlib import Path
          import importlib.util
          root = Path.cwd().resolve()
          version = json.loads((root / 'package.json').read_text())['version']
          output = Path(os.environ['RUNNER_TEMP']) / 'npm-release-package'
          # Stage the linux-x64 binary into a mock platform package for the smoke test.
          # Node resolves @scope/pkg as NODE_PATH/@scope/pkg/, so nest accordingly.
          mock_root = Path(os.environ['RUNNER_TEMP']) / 'mock-node-modules'
          mock_pkg = mock_root / '@miaskiewicz' / 'turbo-surf-linux-x64'
          mock_pkg.mkdir(parents=True)
          (mock_pkg / 'package.json').write_text(json.dumps({
              'name': '@miaskiewicz/turbo-surf-linux-x64', 'version': version}))
          artifacts = root / 'artifacts'
          for f in artifacts.rglob('turbo-surf-mcp-linux-x64'):
              shutil.copy2(f, mock_pkg / 'turbo-surf-mcp')
              (mock_pkg / 'turbo-surf-mcp').chmod(0o755)
              break
          # Point Node module resolution at our mock.
          env = {'NODE_PATH': str(mock_root)}
          spec = importlib.util.spec_from_file_location('release_smoke', root / 'scripts/smoke-mcp-release.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          for name in ('SIGINT', 'SIGTERM', 'SIGHUP'):
              if hasattr(signal, name):
                  signal.signal(getattr(signal, name), smoke.interrupted)
          smoke_output = output / 'javascript-smoke'
          version_env = os.environ.copy()
          version_env['NODE_PATH'] = str(mock_root)
          result = subprocess.run([shutil.which('node'), str(root / 'cli.js'), '--version'],
              capture_output=True, text=True, timeout=30, env=version_env)
          print('CLI --version:', result.stdout.strip(), '(exit', result.returncode, ')')
          if result.returncode != 0:
              print('stderr:', result.stderr)
          receipt = smoke.smoke([shutil.which('node'), str(root / 'cli.js')], version,
              os.environ['GITHUB_SHA'], Path(os.environ['RUNNER_TEMP']) / 'npm-javascript-smoke',
              smoke_output, env=env)
          for stream in ('stdout', 'stderr'):
              log = smoke_output / (stream + '.log')
              if log.is_file():
                  shutil.copyfile(log, output / ('initialize.' + stream + '.log'))
          receipt.update(version=version, cli=str(root / 'cli.js'), thinLauncher=True)
          (output / 'initialize.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if not receipt['initializeVerified'] or not receipt['javascriptVerified']:
              raise SystemExit('Thin launcher CLI smoke failed; see retained evidence')
          print(json.dumps(receipt, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/npm-release-package/*
          if-no-files-found: warn
      - run: npm publish "$RELEASE_TARBALL" --provenance --access public
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
