[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.7.1"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Pre-publish only: turbo-dom, turbo-dom-layout, turbo-dom-raster and turbo-dom-browser-env
# come from turbo-dom's release/0.8.0 branch until 0.8.0 is on crates.io; turbo-dom-v8
# comes from turbo-dom's generated candidate (consolidation/turbo-dom-v8-candidate) for
# turbo-dom#367 `get_incumbent_context` (#90) until its next release is on crates.io.
# Remove this block and re-lock
# (`cargo update -p turbo-dom -p turbo-dom-layout -p turbo-dom-raster -p turbo-dom-browser-env -p turbo-dom-v8`)
# before tagging (see PUBLISHING.md); the tag-only release guard fails while it is present.
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "92a2a61374f1ac025dd3c77aad67ad09aeb451ff" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "92a2a61374f1ac025dd3c77aad67ad09aeb451ff" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "92a2a61374f1ac025dd3c77aad67ad09aeb451ff" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "92a2a61374f1ac025dd3c77aad67ad09aeb451ff" }
turbo-dom-v8 = { git = "https://github.com/miaskiewicz/turbo-dom.git", rev = "79ae001de8e5518a730912e89c7a921fabd5984f" }
