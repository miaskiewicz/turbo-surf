# Publish the turbo-surf Rust library crates to crates.io on a v* tag (mirrors
# turbo-dom's publish-crate job). Requires repo secret CARGO_REGISTRY_TOKEN.
# Published in dependency order so each dependent's version dep is already live:
#   core → view → page → render → mcp.
# The screenshot tier is turbo-dom's turbo-dom-raster (no Surf raster crate).
# Prerequisites published first: turbo-dom-v8, turbo-dom, turbo-dom-layout,
# turbo-dom-raster and turbo-dom-browser-env from the turbo-dom repository (v0.6.0
# tag), then the seven Deno-family 0.x.1 crates from release-dependencies.yml.
# The tag-only release-guard job refuses a tree that still patches them from Git
# (rust/release-deps/release_guard.py: no [patch] table, no git/path sources, every
# prerequisite locked from crates.io at a published, unyanked version).
# NAPI and transform remain unpublished workspace implementation crates; npm ships
# the standalone MCP binary. Before tagging, verify all five actual distributions
# together and run the clean consumer documented in rust/release-deps/surf-consumer.
name: rust-crates-publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: rust

jobs:
  release-guard:
    name: release guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No [patch] table, no git sources, prerequisites on crates.io
        run: python3 -B release-deps/release_guard.py

  publish-crates:
    name: publish-crates
    needs: [release-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact release tag and versions
        run: |
          python3 ../scripts/check-versions.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          version = json.loads(Path('../package.json').read_text())['version']
          if os.environ['GITHUB_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Crate publication requires the exact v' + version + ' tag')
          print('Publishing source:', os.environ['GITHUB_SHA'], 'version:', version)
          PYCODE
      - uses: dtolnay/rust-toolchain@1.98.0
      # BoringSSL builds with cmake/nasm; btls-sys always generates bindings with libclang.
      - name: Install BoringSSL and binding toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev nasm cmake
      # cargo reads CARGO_REGISTRY_TOKEN from the env natively; `cargo publish`
      # waits for each crate to index before the next dependent publishes.
      - run: cargo publish --locked -p turbo-surf-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p turbo-surf-view
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p turbo-surf-page
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p turbo-surf-render
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p turbo-surf-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
