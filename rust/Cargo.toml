[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.8.7"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Temporary immutable development pin: turbo-dom release/0.8.7 at
# 448d05e89240ab8ce20c2be50723500d2c4a2917 (native DOM state, CSS, default History and DOMParser fixes).
# Replace with registry 0.8.7 after publication, before tagging Surf.
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom.git", rev = "448d05e89240ab8ce20c2be50723500d2c4a2917" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom.git", rev = "448d05e89240ab8ce20c2be50723500d2c4a2917" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom.git", rev = "448d05e89240ab8ce20c2be50723500d2c4a2917" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom.git", rev = "448d05e89240ab8ce20c2be50723500d2c4a2917" }
