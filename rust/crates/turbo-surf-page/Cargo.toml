[package]
name = "turbo-surf-page"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf tier 2: Page over the turbo-dom Rust parser + Navigator impl"

[features]
default = ["impersonate"]
# Forward turbo-surf-core's BoringSSL Chrome-fingerprint client. See its net.rs.
impersonate = ["turbo-surf-core/impersonate"]
# TEMPORARY consolidation gate (turbo-dom docs/selector-dual-gate.md): forward turbo-dom's
# `selector-dual` (frozen B-main selector engine run next to the current one). Never
# enable it in a published or production build; removed in the last S3b commit.
selector-dual = ["turbo-dom-parser/selector-dual"]

[dependencies]
turbo-surf-core = { path = "../turbo-surf-core", version = "0.5.5" }
turbo-dom-parser = { package = "turbo-dom", version = "0.5.8" }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
