[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.8.4"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# Native DOM candidate; the reviewed Deno/native V8 distributions use registry versions.
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "06c6f204a4ce55ed3204ee0472b1dff3b9a3871e" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "06c6f204a4ce55ed3204ee0472b1dff3b9a3871e" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "06c6f204a4ce55ed3204ee0472b1dff3b9a3871e" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "06c6f204a4ce55ed3204ee0472b1dff3b9a3871e" }
