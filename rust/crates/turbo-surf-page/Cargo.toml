[package]
name = "turbo-surf-page"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf tier 2: Page over the turbo-dom Rust parser + Navigator impl"

[features]
default = ["impersonate"]
# Forward turbo-surf-core's BoringSSL Chrome-fingerprint client. See its net.rs.
impersonate = ["turbo-surf-core/impersonate"]

[dependencies]
turbo-surf-core = { path = "../turbo-surf-core", version = "0.5.4" }
turbo-dom-parser = { package = "turbo-dom", version = "0.5.7", git = "https://github.com/miaskiewicz/turbo-dom", rev = "d01d6a5911e3f7a47c0d91d619de01c1008dc28a" }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
