name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels its superseded run; push, tag and release
# (workflow_call) runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: lint (no Rust compilation — fast feedback in ~2 min)
  # --------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci
      - name: JS lint
        run: npm run lint
      - name: JS format check
        run: npm run format:check
      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check
      - name: Version consistency
        run: python3 scripts/check-versions.py
      - name: Single V8 check
        run: bash scripts/check-single-v8.sh
      - name: Third-party notices
        run: python3 scripts/sync-third-party-notices.py --check
      - name: Audio source verification
        run: python3 harness/detection/verify-audio-sources.py
      - name: Release smoke supervisor tests
        run: python3 -B scripts/test_smoke_mcp_release.py
      - name: Coverage floor tests
        run: python3 -B scripts/test_check_coverage_floors.py
      - name: Coverage shard tests
        run: python3 -B scripts/test_coverage_shard.py
      - name: Release-deps Python tests
        run: |
          python3 -B -m unittest discover -s rust/release-deps -p 'test_*.py'
          python3 -B -m unittest discover -s rust/release-deps/deno -p 'test_*.py'

  # --------------------------------------------------------------------------
  # Stage 2: build (one workspace compilation via clippy — shared cache key)
  # --------------------------------------------------------------------------
  build:
    name: build + clippy
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BoringSSL toolchain (nasm/cmake)
        run: sudo apt-get update && sudo apt-get install -y nasm cmake
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: build
      - name: Install
        run: npm ci
      - name: Clippy (workspace)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (rustls backend)
        working-directory: rust
        run: cargo clippy -p turbo-surf-core --no-default-features --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # Stage 3a: Rust tests (reuses cached build artifacts from the build job)
  # --------------------------------------------------------------------------
  test-rust:
    name: test (rust)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BoringSSL toolchain (nasm/cmake)
        run: sudo apt-get update && sudo apt-get install -y nasm cmake
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: build
          save-if: false
      - name: Rust tests (workspace)
        working-directory: rust
        run: cargo test --workspace
      - name: rustls backend tests
        working-directory: rust
        run: cargo test -p turbo-surf-core --no-default-features

  # --------------------------------------------------------------------------
  # Stage 3b: Playwright shim + E2E + detection (builds napi addon separately)
  # --------------------------------------------------------------------------
  test-playwright:
    name: test (playwright)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BoringSSL toolchain (nasm/cmake)
        run: sudo apt-get update && sudo apt-get install -y nasm cmake
      # Separate cache for the napi release build (different profile than the
      # dev/test build the build job produces).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: napi
      - name: Install
        run: npm ci
      - name: Playwright shim + E2E tests (local Cargo addon)
        run: npm run test:playwright
      - name: Detection tests
        run: npm run test:detection

  # --------------------------------------------------------------------------
  # Coverage shards (instrumented builds — must compile independently)
  # Branch off lint in parallel with build+test.
  # --------------------------------------------------------------------------
  coverage-shard:
    name: coverage shard (${{ matrix.shard }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # render is split across two runners (4 chunks, 2 per runner) to halve wall-clock.
          - shard: render-a
            crates: --chunks 4 --slice 0/2 turbo-surf-render
          - shard: render-b
            crates: --chunks 4 --slice 1/2 turbo-surf-render
          - shard: mcp
            crates: turbo-surf-mcp
          - shard: rest
            crates: turbo-surf-core turbo-surf-view turbo-surf-page turbo-surf-transform
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.37.5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target/cov
          key: coverage-${{ matrix.shard }}
      - name: Install
        run: npm ci
      - name: cargo tarpaulin (${{ matrix.crates }})
        working-directory: rust
        run: python3 ../scripts/coverage-shard.py ${{ matrix.shard }} ${{ matrix.crates }}
      - run: df -h
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: rust/target/cov/report-${{ matrix.shard }}/tarpaulin-report.json
          if-no-files-found: error

  coverage:
    name: coverage (rust workspace, tarpaulin fail-under)
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: shards
      - name: Union render-a + render-b into one render report
        run: |
          mkdir -p shards/coverage-shard-render
          python3 scripts/merge-render-slices.py \
            shards/coverage-shard-render-a/tarpaulin-report.json \
            shards/coverage-shard-render-b/tarpaulin-report.json \
            shards/coverage-shard-render/tarpaulin-report.json
      - name: Merge shards (fails below rust/tarpaulin.toml fail-under)
        run: >
          python3 scripts/merge-coverage-reports.py rust/tarpaulin.toml coverage-merged.json
          turbo-surf-render=shards/coverage-shard-render/tarpaulin-report.json
          turbo-surf-mcp=shards/coverage-shard-mcp/tarpaulin-report.json
          turbo-surf-core,turbo-surf-view,turbo-surf-page,turbo-surf-transform=shards/coverage-shard-rest/tarpaulin-report.json
      - name: Per-crate floors (rust/coverage-floors.json)
        run: python3 scripts/check-coverage-floors.py coverage-merged.json rust/coverage-floors.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-rust
          path: coverage-merged.json
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Complexity: cyclomatic complexity <= 15 per function (no Rust build needed)
  # --------------------------------------------------------------------------
  complexity-rust:
    name: complexity / rust (cc <= 15)
    runs-on: ubuntu-latest
    env:
      CC_CHECK_REV: 923c89f791f3a89cb089a59626a25cef0a9cbd5f
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/cache@v4
        with:
          path: ~/.cc-check
          key: cc-check-${{ runner.os }}-${{ env.CC_CHECK_REV }}
      - name: Install cc-check (turbo-html2pdf tools/cc-check @ CC_CHECK_REV)
        run: |
          if [ ! -x "$HOME/.cc-check/bin/cc-check" ]; then
            cargo install --locked --root "$HOME/.cc-check" \
              --git https://github.com/miaskiewicz/turbo-html2pdf --rev "$CC_CHECK_REV" cc-check
          fi
          echo "$HOME/.cc-check/bin" >> "$GITHUB_PATH"
      - name: cc-check --max 15 (every tracked .rs file)
        shell: bash
        run: npm run -s complexity:rust 2>&1 | tee complexity.txt
      - name: List the functions over the limit
        if: failure()
        run: |
          { echo '### Rust functions above cc 15'; echo '```'; grep 'cyclomatic complexity' complexity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  complexity-js:
    name: complexity / js (cc <= 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: oxlint complexity max 15 (cli.js, index.js, harness/)
        shell: bash
        run: npm run -s complexity:js 2>&1 | tee complexity.txt
      - name: List the functions over the limit
        if: failure()
        run: |
          { echo '### JS functions above cc 15'; echo '```'; grep 'complexity of' complexity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
