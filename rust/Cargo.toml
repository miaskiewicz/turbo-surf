[workspace]
resolver = "2"
members = [
    "crates/turbo-surf-core",
    "crates/turbo-surf-napi",
    "crates/turbo-surf-mcp",
    "crates/turbo-surf-page",
    "crates/turbo-surf-py",
    "crates/turbo-surf-render",
    "crates/turbo-surf-transform",
    "crates/turbo-surf-view",
]

[workspace.package]
edition = "2021"
version = "0.5.5"
license = "MIT"
repository = "https://github.com/miaskiewicz/turbo-surf"

# Tier 1 of the Rust port: the browserless, native-speed core (net / cookies /
# robots / url / frontier / crawl-scheduling). The JS-execution tier (deno_core)
# and the napi/playwright shim land in later tiers; turbo-dom ships as its own
# Rust crate and is wired into tiers 2-3.
[profile.release]
opt-level = 3
lto = "thin"

# PRE-PUBLISH ONLY (turbo-dom consolidation): resolve the not-yet-published crates
# from Git. Removed at release, before tagging: drop this table, then re-lock with a
# targeted `cargo update -p` once each crate is on crates.io (see PUBLISHING.md).
# - the seven Deno-family 0.x.1 candidates (rust/release-deps/push-candidates.sh,
#   orphan branch consolidation/deno-candidates);
# - turbo-dom-v8, the generated rusty_v8 fork (turbo-dom orphan branch
#   consolidation/turbo-dom-v8-candidate);
# - turbo-dom 0.5.8 (consolidation branch) and its new turbo-dom-layout,
#   turbo-dom-raster and turbo-dom-browser-env 0.6.0 crates.
[patch.crates-io]
turbo-surf-deno-v8 = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-serde-v8 = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-deno-core = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-deno-bench-util = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-deno-crypto = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-deno-web = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-surf-deno-webidl = { git = "https://github.com/miaskiewicz/turbo-surf", rev = "9f5fdd72342f0a3afd91fafe1148ee7f477362ba" }
turbo-dom-v8 = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "e9b36c8733ef1cf1073f7053a8c5931381c978c5" }
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "2c3bcef50210c889b00139dba6c354c8539aadb2" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "2c3bcef50210c889b00139dba6c354c8539aadb2" }
turbo-dom-raster = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "2c3bcef50210c889b00139dba6c354c8539aadb2" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "2c3bcef50210c889b00139dba6c354c8539aadb2" }
