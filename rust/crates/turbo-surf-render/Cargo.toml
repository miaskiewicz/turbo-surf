[package]
name = "turbo-surf-render"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf JS-execution tier (tier 3): deno_core isolate + rtdom↔V8 DOM binding"

[dependencies]
deno_core = "0.412"
# Official native WebCrypto and its lazy Web IDL/console dependencies share the
# existing deno_core/V8 facade; they do not replace the rtdom DOM globals.
deno_crypto = "=0.273.0"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
# X-Wing uses the same reviewed primitives already pulled in by deno_crypto.
fips203 = "=0.4.3"
x25519-dalek = "=2.0.1"
sha3 = "=0.10.9"
zeroize = "1"
subtle = "2"
# Error type for the ESM ModuleLoader (deno_core's ModuleLoaderError = deno_error::JsErrorBox);
# pinned to the version deno_core 0.412 resolves so the types unify.
deno_error = "=0.7.1"
# Use deno_core's facade for the binding's bare `v8` imports as well. The facade's
# V8 backend uses official rusty_v8 150.4; mixing in a second native V8 library
# would make the DOM handles incompatible with the runtime's context.
v8 = { package = "deno_v8", version = "=0.4.0" }
turbo-dom-parser = { package = "turbo-dom", version = "0.5.7", git = "https://github.com/miaskiewicz/turbo-dom", rev = "aaeb290c4fea12a1ed98185f1d0628758da53db1" }
# Public live-tree snapshots preserve source provenance without HTML serialization.
# Tested PR23 candidate; switch to the registry only after0.3.8 is published.
turbo-html2pdf-core = { version = "0.3.8", git = "https://github.com/miaskiewicz/turbo-html2pdf", rev = "dcbfd20ea9139051b784dcb7a81d2ba6d87e8eba" }
# default-features off: the render tier doesn't need the `impersonate` (BoringSSL)
# fetch backend, so downstream non-binary consumers (the PyO3 wheel) avoid its
# extra transport build. V8, native crypto and audio still require native toolchains.
# The shipped mcp binary gets impersonate — it requests
# `turbo-surf-core/impersonate` explicitly (its own default).
turbo-surf-core = { path = "../turbo-surf-core", version = "0.5.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
psl = "2"
sfv = "=0.15.0"
encoding_rs = "0.8"
getrandom = "0.4"
# Chrome 155 Blink uses this exact RustFFT implementation for PeriodicWave.
rustfft = "=6.4.1"
# base64-encode raster PNG bytes for the toDataURL op boundary (op returns a base64 string).
base64 = "0.22"
# CSP hash-source checks operate on the parser's actual UTF-8 script text.
sha2 = "0.10"
# Resource loads decode actual image bytes before reporting dimensions/load success.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The canonical DOM binding validates CSS grammar before building its CSSOM facade.
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
cssparser = "0.37"
# For the async `RecaptchaEngine` trait impl (same trait style as turbo-surf-core).
async-trait = "0.1"
# The reCAPTCHA engine drives the (`!Send`) deno_core render on a dedicated thread with
# its own current-thread runtime, and returns the token over a oneshot channel — so the
# engine/solver future stays `Send`. rt/time/net/io-util back deno_core's op_fetch loop.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
httpdate = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
