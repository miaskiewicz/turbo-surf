[package]
name = "turbo-surf-napi"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "turbo-surf napi-rs addon — in-process bridge from the Rust core to Node"

[lib]
crate-type = ["cdylib"]

[features]
# Forward turbo-surf-core's BoringSSL Chrome-fingerprint client (dev/harness use
# of the impersonation path). See turbo-surf-core/src/net.rs.
impersonate = ["turbo-surf-core/impersonate", "turbo-surf-page/impersonate"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
turbo-surf-core = { path = "../turbo-surf-core", version = "0.3.2" }
turbo-surf-page = { path = "../turbo-surf-page", version = "0.3.2" }
turbo-surf-view = { path = "../turbo-surf-view", version = "0.3.2" }
turbo-surf-raster = { path = "../turbo-surf-raster", version = "0.3.2" }
turbo-surf-render = { path = "../turbo-surf-render", version = "0.3.2" }
turbo-surf-transform = { path = "../turbo-surf-transform", version = "0.3.2" }
turbo-dom-parser = { package = "turbo-dom", version = "0.4.0" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"
